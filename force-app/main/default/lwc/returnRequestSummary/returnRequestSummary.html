<template>
  <template lwc:if={request}>
    <section class="summary" aria-label="Chi tiết yêu cầu đổi trả">
      <header class="summary-header">
        <div>
          <p class="slds-text-title_bold">Mã yêu cầu</p>
          <h2 class="slds-text-heading_medium" tabindex="-1">
            {request.requestNumber}
          </h2>
        </div>
        <lightning-badge label={statusText}></lightning-badge>
      </header>
      <dl class="facts">
        <div>
          <dt class="slds-text-title_bold">Ngày tạo</dt>
          <dd>
            <lightning-formatted-date-time
              value={request.createdAt}
              day="2-digit"
              month="2-digit"
              year="numeric"
              hour="2-digit"
              minute="2-digit"
            ></lightning-formatted-date-time>
          </dd>
        </div>
        <template lwc:if={showAmount}>
          <div data-section="amount">
            <dt class="slds-text-title_bold">{amountTitle}</dt>
            <dd>
              <template lwc:if={hasAmount}>
                <lightning-formatted-number
                  value={request.refundAmount}
                  format-style="currency"
                  currency-code="VND"
                  maximum-fraction-digits="0"
                ></lightning-formatted-number>
              </template>
              <template lwc:else>Chưa xác định</template>
            </dd>
          </div>
        </template>
      </dl>
      <section class="detail-section" aria-label="Lịch sử trạng thái">
        <h3 class="slds-text-heading_small">Lịch sử trạng thái</h3>
        <ol class="history">
          <template for:each={history} for:item="change">
            <li key={change.key}>
              <span>{change.label}</span>
              <lightning-formatted-date-time
                value={change.changedAt}
                day="2-digit"
                month="2-digit"
                year="numeric"
                hour="2-digit"
                minute="2-digit"
              ></lightning-formatted-date-time>
            </li>
          </template>
        </ol>
      </section>
      <template lwc:if={hasProducts}>
        <section class="detail-section" aria-label="Sản phẩm trả">
          <h3 class="slds-text-heading_small">Sản phẩm trả</h3>
          <ul class="products">
            <template for:each={products} for:item="product">
              <li key={product.key}>
                <span>{product.productName}</span>
                <span
                  >Số lượng:
                  <lightning-formatted-number
                    value={product.quantity}
                  ></lightning-formatted-number
                ></span>
              </li>
            </template>
          </ul>
        </section>
      </template>
    </section>
  </template>
</template>

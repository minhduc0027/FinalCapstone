<template>
  <lightning-record-view-form
    record-id={recordId}
    object-api-name="Refund_Transaction__c"
  >
    <lightning-accordion
      allow-multiple-sections-open
      active-section-name={openSections}
    >
      <lightning-accordion-section name="summary" label="Refund Summary">
        <div class="slds-grid slds-wrap">
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Name"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Status__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Return_Request__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Merchant_Reference__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Order_Number__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Refund_Amount__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="PayHub_Refund_Id__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Provider_Processed_At__c"
          ></lightning-output-field>
        </div>
      </lightning-accordion-section>

      <lightning-accordion-section name="failure" label="Failure and Attempts">
        <div class="slds-grid slds-wrap">
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Last_Error_Code__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Attempt_Count__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Last_Error_Message__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Last_Attempt_At__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Next_Retry_At__c"
          ></lightning-output-field>
        </div>
      </lightning-accordion-section>

      <lightning-accordion-section
        name="reconciliation"
        label="External Transfer Reconciliation"
      >
        <div class="slds-grid slds-wrap">
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Manual_Reference__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Manual_Completed_By__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Manual_Completed_At__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Accounting_Task_Id__c"
          ></lightning-output-field>
        </div>
      </lightning-accordion-section>

      <lightning-accordion-section name="technical" label="Technical Details">
        <div class="slds-grid slds-wrap">
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Idempotency_Key__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Worker_Job_Id__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="OwnerId"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="Completed_At__c"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="CreatedById"
          ></lightning-output-field>
          <lightning-output-field
            class="slds-size_1-of-1 slds-medium-size_1-of-2"
            field-name="LastModifiedById"
          ></lightning-output-field>
        </div>
      </lightning-accordion-section>
    </lightning-accordion>
  </lightning-record-view-form>
</template>

<template>
  <section class="filters slds-m-top_medium" aria-label="Approval filters">
    <div class="filter-grid">
      <!-- Store -->
      <lightning-record-picker
        label="Store"
        placeholder="Search stores"
        object-api-name="Store__c"
        value={storeId}
        onchange={handleStoreChange}
      >
      </lightning-record-picker>

      <!-- Customer -->
      <lightning-record-picker
        label="Customer"
        placeholder="Search customers"
        object-api-name="Account"
        value={customerId}
        onchange={handleCustomerChange}
      >
      </lightning-record-picker>

      <!-- From Date -->
      <lightning-input
        type="date"
        label="From date"
        value={fromDate}
        data-field="fromDate"
        onchange={handleFieldChange}
      >
      </lightning-input>

      <!-- To Date -->
      <lightning-input
        type="date"
        label="To date"
        value={toDate}
        data-field="toDate"
        onchange={handleFieldChange}
      >
      </lightning-input>

      <!-- Sort By -->
      <lightning-combobox
        label="Sort by"
        value={sortBy}
        options={sortOptions}
        data-field="sortBy"
        onchange={handleFieldChange}
      >
      </lightning-combobox>

      <!-- Sort Direction -->
      <lightning-combobox
        label="Sort direction"
        value={sortDirection}
        options={sortDirections}
        data-field="sortDirection"
        onchange={handleFieldChange}
      >
      </lightning-combobox>

      <!-- Approval Level -->
      <lightning-combobox
        label="Approval level"
        value={approvalLevel}
        options={levelOptions}
        data-field="approvalLevel"
        onchange={handleFieldChange}
      >
      </lightning-combobox>

      <!-- Page Size -->
      <lightning-combobox
        label="Rows"
        value={pageSize}
        options={pageSizeOptions}
        data-field="pageSize"
        onchange={handleFieldChange}
      >
      </lightning-combobox>
    </div>

    <div class="filter-actions slds-m-top_small">
      <lightning-button
        label="Apply Filters"
        variant="brand-outline"
        onclick={handleApply}
      >
      </lightning-button>

      <lightning-button label="Reset" onclick={handleReset}> </lightning-button>
    </div>
  </section>
</template>

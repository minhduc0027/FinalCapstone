<template>
  <template lwc:if={isOpen}>
    <section
      class="slds-modal slds-fade-in-open dialog-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="refund-modal-title"
      onkeydown={handleKeydown}
    >
      <div class="slds-modal__container dialog-container">
        <header class="slds-modal__header dialog-header">
          <h2
            id="refund-modal-title"
            class="slds-text-heading_small slds-text-title_bold"
          >
            Complete Refund
          </h2>
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="Close"
            aria-label="Close"
            title="Close"
            variant="bare-inverse"
            class="dialog-close"
            onclick={handleClose}
            disabled={submitting}
          ></lightning-button-icon>
        </header>

        <div
          class="slds-modal__content slds-var-p-around_medium dialog-content"
        >
          <template lwc:if={loadError}>
            <p role="alert">{loadError}</p>
          </template>
          <template lwc:elseif={loading}>
            <lightning-spinner
              alternative-text="Loading refund details"
              size="small"
            ></lightning-spinner>
          </template>
          <template lwc:else>
            <div class="slds-m-bottom_medium" aria-live="polite">
              <template lwc:if={reconciled}>
                <p class="slds-text-color_success slds-text-title_bold">
                  <lightning-icon
                    class="slds-m-right_x-small"
                    icon-name="utility:success"
                    size="x-small"
                    variant="success"
                    alternative-text=""
                  ></lightning-icon>
                  {statusText}
                </p>
              </template>
              <template lwc:else>
                <p class="slds-text-title_bold">{statusText}</p>
              </template>
            </div>

            <dl
              class="slds-grid slds-wrap slds-border_bottom slds-p-bottom_medium"
            >
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-right_small slds-var-p-bottom_medium"
              >
                <dt
                  class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                >
                  Refund amount
                </dt>
                <dd class="slds-text-heading_medium">
                  <lightning-formatted-number
                    value={amount}
                    format-style="decimal"
                    maximum-fraction-digits="0"
                  ></lightning-formatted-number>
                  <span class="slds-text-body_small"> VND</span>
                </dd>
              </div>
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-bottom_medium"
              >
                <dt
                  class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                >
                  Return request
                </dt>
                <dd class="slds-text-heading_small">{merchantReference}</dd>
              </div>
              <div
                class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-right_small"
              >
                <dt
                  class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                >
                  Refund
                </dt>
                <dd class="slds-text-heading_small">{name}</dd>
              </div>
              <div class="slds-size_1-of-1 slds-medium-size_1-of-2">
                <dt
                  class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                >
                  Order number
                </dt>
                <dd class="slds-text-heading_small">{orderNumber}</dd>
              </div>
            </dl>

            <template lwc:if={awaitingReconciliation}>
              <section class="slds-var-p-vertical_small slds-border_bottom">
                <h3 class="slds-text-title_bold slds-m-bottom_xx-small">
                  PayHub failure
                </h3>
                <p>
                  <span>{errorCode}</span>
                  <template lwc:if={errorDetail}>
                    <span> · </span>
                    <lightning-formatted-text
                      value={errorDetail}
                    ></lightning-formatted-text>
                  </template>
                </p>
              </section>
            </template>

            <template lwc:if={canComplete}>
              <section class="slds-var-p-top_small">
                <h3 class="slds-text-title_bold">External transfer</h3>
                <p class="slds-text-color_weak slds-m-bottom_small">
                  Confirm only after verifying the transfer and customer
                  receipt.
                </p>
                <lightning-input
                  type="text"
                  label="External transfer reference"
                  value={reference}
                  onchange={handleReference}
                  maxlength="80"
                  required
                ></lightning-input>
                <lightning-input
                  type="checkbox"
                  label="I verified the external transfer and customer receipt"
                  checked={confirmed}
                  onchange={handleConfirmation}
                ></lightning-input>
              </section>
            </template>

            <template lwc:if={reconciled}>
              <section class="slds-var-p-top_small">
                <h3 class="slds-text-title_bold slds-m-bottom_small">
                  Manual completion recorded
                </h3>
                <dl class="slds-grid slds-wrap">
                  <div
                    class="slds-size_1-of-1 slds-medium-size_1-of-2 slds-var-p-right_small slds-var-p-bottom_small"
                  >
                    <dt
                      class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                    >
                      External transfer reference
                    </dt>
                    <dd class="slds-text-heading_small reference-value">
                      {manualReference}
                    </dd>
                  </div>
                  <div class="slds-size_1-of-1 slds-medium-size_1-of-2">
                    <dt
                      class="slds-text-title slds-text-title_bold slds-text-color_weak slds-m-bottom_xx-small"
                    >
                      Recorded at
                    </dt>
                    <dd class="slds-text-heading_small">
                      <lightning-formatted-date-time
                        value={manualAt}
                        day="2-digit"
                        month="2-digit"
                        year="numeric"
                        hour="2-digit"
                        minute="2-digit"
                      ></lightning-formatted-date-time>
                    </dd>
                  </div>
                </dl>
              </section>
            </template>

            <template lwc:if={actionError}>
              <p class="slds-m-top_small" role="alert">{actionError}</p>
            </template>
            <template lwc:if={verifying}>
              <p class="slds-m-top_small" role="status">
                Confirmation submitted. Verifying the saved status. Refresh the
                record if it does not update.
              </p>
            </template>
          </template>
        </div>

        <footer class="slds-modal__footer dialog-footer">
          <lightning-button
            label={closeLabel}
            onclick={handleClose}
            disabled={submitting}
          ></lightning-button>
          <template lwc:if={canComplete}>
            <lightning-button
              class="slds-m-left_small"
              variant="brand"
              label="Confirm"
              onclick={handleComplete}
              disabled={canSubmitDisabled}
            ></lightning-button>
          </template>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open dialog-backdrop"></div>
  </template>
</template>

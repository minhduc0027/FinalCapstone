<template>
  <section class="inspection-lines" aria-label="Inspection results">
    <template if:true={hasSelection}>
      <header class="header">
        <div class="header-content">
          <h2 class="slds-text-heading_small">Inspection Results</h2>

          <p class="slds-text-body_small slds-text-color_weak">
            Complete the inspection result for every return line before
            submitting.
          </p>
        </div>
      </header>

      <template if:true={hasRows}>
        <div class="line-list">
          <template for:each={rows} for:item="row">
            <article key={row.id} class="line-card">
              <section class="summary" aria-label="Return line information">
                <div class="product-heading">
                  <h3 class="product-name">{row.productName}</h3>
                </div>

                <dl class="summary-grid">
                  <div class="summary-item">
                    <dt>Requested quantity</dt>
                    <dd>{row.requestedQuantity}</dd>
                  </div>

                  <div class="summary-item">
                    <dt>Purchased quantity</dt>
                    <dd>{row.purchasedQuantity}</dd>
                  </div>

                  <div class="summary-item">
                    <dt>Unit price</dt>

                    <dd>
                      <template if:true={row.hasUnitPrice}>
                        <lightning-formatted-number
                          value={row.unitPrice}
                          format-style="currency"
                          currency-code="VND"
                          maximum-fraction-digits="0"
                        >
                        </lightning-formatted-number>
                      </template>

                      <template if:false={row.hasUnitPrice}> — </template>
                    </dd>
                  </div>

                  <div class="summary-item">
                    <dt>Reported condition</dt>
                    <dd>{row.reportedCondition}</dd>
                  </div>

                  <div class="summary-item summary-item-wide">
                    <dt>Return reason</dt>
                    <dd>{row.returnReason}</dd>
                  </div>
                </dl>
              </section>

              <section class="fields" aria-label="Inspection input">
                <div class="field field-condition">
                  <lightning-combobox
                    required
                    label="Actual condition"
                    placeholder="Select actual condition"
                    value={row.actualCondition}
                    options={actualConditionOptions}
                    data-id={row.id}
                    data-field="actualCondition"
                    onchange={handleFieldChange}
                  >
                  </lightning-combobox>
                </div>
                <div class="field field-result">
                  <lightning-combobox
                    required
                    label="Inspection result"
                    value={row.inspectionResult}
                    options={inspectionResultOptions}
                    data-id={row.id}
                    data-field="inspectionResult"
                    onchange={handleFieldChange}
                  >
                  </lightning-combobox>
                </div>

                <div class="field field-code">
                  <lightning-combobox
                    required
                    label="Eligibility code"
                    placeholder="Select code"
                    value={row.eligibilityCode}
                    options={eligibilityCodeOptions}
                    data-id={row.id}
                    data-field="eligibilityCode"
                    onchange={handleFieldChange}
                  >
                  </lightning-combobox>
                </div>

                <div class="field field-reason">
                  <lightning-textarea
                    required={row.reasonRequired}
                    label="Eligibility reason"
                    value={row.eligibilityReason}
                    data-id={row.id}
                    data-field="eligibilityReason"
                    onchange={handleFieldChange}
                  >
                  </lightning-textarea>
                </div>
              </section>
            </article>
          </template>
        </div>

        <footer class="actions">
          <lightning-button
            label="Submit Inspection"
            variant="brand"
            disabled={disableSubmit}
            onclick={handleSubmit}
          >
          </lightning-button>
        </footer>
      </template>

      <template if:true={showNoRows}>
        <div class="empty">No return lines were found for this request.</div>
      </template>
    </template>

    <template if:true={showNoSelection}>
      <div class="empty">
        Select a request from the worklist to inspect its return lines.
      </div>
    </template>

    <template if:true={isLoading}>
      <lightning-spinner
        alternative-text="Loading inspection lines"
        size="medium"
      >
      </lightning-spinner>
    </template>
  </section>
</template>

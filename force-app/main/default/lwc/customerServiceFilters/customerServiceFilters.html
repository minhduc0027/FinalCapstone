<template>
  <div class="slds-grid slds-wrap slds-gutters">
    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
      <lightning-input
        type="tel"
        name="customerPhone"
        label="Customer phone"
        value={customerPhone}
        onchange={handleInputChange}
        onkeyup={handleKeyUp}
      >
      </lightning-input>
    </div>

    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
      <lightning-input
        type="search"
        name="orderNumber"
        label="Order number"
        value={orderNumber}
        onchange={handleInputChange}
        onkeyup={handleKeyUp}
      >
      </lightning-input>
    </div>

    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
      <lightning-input
        type="search"
        name="customerName"
        label="Customer name"
        value={customerName}
        onchange={handleInputChange}
        onkeyup={handleKeyUp}
      >
      </lightning-input>
    </div>
  </div>

  <div class="filter-actions slds-m-top_medium">
    <lightning-button label="Clear" onclick={handleClear}> </lightning-button>

    <lightning-button label="Search" variant="brand" onclick={handleSearch}>
    </lightning-button>
  </div>
</template>

<template>
  <div class="slds-grid slds-gutters">
    <div class="slds-col slds-size_1-of-1">
      <lightning-input
        type="search"
        name="searchTerm"
        label="Search return requests"
        placeholder="Phone, order number or customer name"
        value={searchTerm}
        onchange={handleInputChange}
        onkeyup={handleKeyUp}
      >
      </lightning-input>
    </div>
  </div>

  <div class="filter-actions slds-m-top_medium">
    <lightning-button label="Clear" onclick={handleClear}> </lightning-button>

    <lightning-button label="Search" variant="brand" onclick={handleSearch}>
    </lightning-button>
  </div>
</template>

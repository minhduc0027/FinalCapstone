name: Validate Salesforce Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Install SFDX Git Delta
        run: echo y | sf plugins install sfdx-git-delta

      - name: Generate Delta
        run: |
          mkdir -p delta

          sf sgd source delta \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to HEAD \
            --ignore-file .forceignore \
            --output-dir delta

      - name: Install Node Dependencies
        run: npm ci

      - name: Run LWC Jest Tests
        run: npx sfdx-lwc-jest -- --passWithNoTests

      - name: Create JWT Key
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key

      - name: Authenticate Salesforce
        run: |
          sf org login jwt --client-id ${{ secrets.SF_CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.SF_USERNAME }} --instance-url ${{ secrets.SF_INSTANCE_URL }} --alias prod

      - name: Validate Deployment
        run: |
          PACKAGE="delta/package/package.xml"
          DESTRUCTIVE="delta/destructiveChanges/destructiveChanges.xml"

          if ! grep -q '<types>' "$PACKAGE" &&
             ! grep -q '<types>' "$DESTRUCTIVE"; then
            echo "No metadata changes."
            exit 0
          fi

          ARGS=(--manifest "$PACKAGE")

          if grep -q '<types>' "$DESTRUCTIVE"; then
            ARGS+=(--post-destructive-changes "$DESTRUCTIVE")
          fi

          sf project deploy validate \
            --target-org prod \
            --test-level RunLocalTests \
            --wait 120 \
            "${ARGS[@]}"
